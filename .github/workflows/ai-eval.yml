# AI 답변 게이트: 거래 복기 답변에 영향을 주는 코드가 바뀐 PR에서 평가를 돌리고, 기준에 못 미치면 실패합니다.
# 필수 검사로 지정할 수 있도록 PR마다 항상 실행되고, 관련 파일이 바뀌지 않았으면 평가 단계만 건너뜁니다.
name: AI 답변 평가

on:
  pull_request:
  # 머지 직전이나 프롬프트를 크게 바꿨을 때 flash로도 확인할 수 있게 직접 실행에서 모델을 고릅니다.
  workflow_dispatch:
    inputs:
      model:
        description: 평가할 Gemini 모델
        type: choice
        default: gemini-3.5-flash-lite
        options:
          - gemini-3.5-flash-lite
          - gemini-3.5-flash

concurrency:
  group: ai-eval-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  trade-review:
    name: 거래 복기 AI 게이트
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 평가 대상 변경 확인
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(apps/api/src/trade-review/|apps/api/src/stock-diagnosis/(gemini|naver-news|dart)\.client\.ts|apps/api/src/daily-price/|apps/api/evals/|apps/api/vitest\.config\.eval\.ts|packages/shared/src/schemas/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "AI 답변에 영향을 주는 파일이 바뀌지 않아 평가를 건너뛰었어요." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 서비스와 한도가 겹치지 않도록, 다른 구글 프로젝트에서 발급한 평가 전용 키를 씁니다.
      - name: Gemini 평가용 키 확인
        if: steps.changes.outputs.run == 'true'
        env:
          EVAL_GEMINI_API_KEY: ${{ secrets.GEMINI_EVAL_API_KEY }}
        run: |
          if [ -z "$EVAL_GEMINI_API_KEY" ]; then
            echo "::error::저장소 Secrets에 GEMINI_EVAL_API_KEY가 없어 평가할 수 없어요."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.run == 'true'
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: 공유 패키지 빌드
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @underscore/shared build

      - name: 평가 실행
        if: steps.changes.outputs.run == 'true'
        env:
          EVAL_GEMINI_API_KEY: ${{ secrets.GEMINI_EVAL_API_KEY }}
          EVAL_GEMINI_MODEL: ${{ inputs.model || 'gemini-3.5-flash-lite' }}
          EVAL_RUNS: '3'
        run: pnpm --filter api eval

      - name: 평가 결과 보관
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-trade-review
          path: apps/api/evals/trade-review/.results/
          include-hidden-files: true
          if-no-files-found: ignore
